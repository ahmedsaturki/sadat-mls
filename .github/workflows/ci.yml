name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  gen-types:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Generate TypeScript types from schema
        run: npx supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public > src/lib/supabase/types.auto.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: aaxauqznfhcvgevfczye
      - name: Fail on generated type drift
        run: |
          if ! diff -q src/lib/supabase/types.ts src/lib/supabase/types.auto.ts > /dev/null 2>&1; then
            echo "::error::Checked-in Supabase types are out of sync with the live Aqarat schema."
            echo "Regenerate src/lib/supabase/types.ts from project aaxauqznfhcvgevfczye and commit the exact result."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-types
          path: src/lib/supabase/types.auto.ts
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm run test:run

  schema-contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Verify Aqarat OS application contract
        run: npm run contract:check

  e2e:
    runs-on: ubuntu-latest
    needs: [test, schema-contract]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Resolve current Supabase privileged API key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: aaxauqznfhcvgevfczye
        run: |
          set -euo pipefail
          npm install -g supabase
          key_json="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          key="$(
            printf '%s' "$key_json" |
              node -e '
                let input = "";
                process.stdin.on("data", chunk => { input += chunk; });
                process.stdin.on("end", () => {
                  const keys = JSON.parse(input);
                  const list = Array.isArray(keys) ? keys : [];
                  const modern = list.find(
                    entry => entry.type === "secret" && typeof entry.api_key === "string" && entry.api_key.startsWith("sb_secret_"),
                  );
                  const legacy = list.find(
                    entry =>
                      (entry.id === "service_role" || (entry.type === "legacy" && entry.name === "service_role")) &&
                      typeof entry.api_key === "string" &&
                      entry.api_key.startsWith("eyJ"),
                  );
                  const value = modern?.api_key ?? legacy?.api_key ?? "";
                  if (!value) process.exit(2);
                  process.stdout.write(value);
                });
              '
          )"
          if [[ ! "$key" =~ ^(sb_secret_|eyJ) ]]; then
            echo "::error::Supabase API-key resolution returned an unexpected key format."
            exit 1
          fi
          echo "::add-mask::$key"
          printf '%s\n' "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
          echo "Resolved current Supabase privileged API key for CI."
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://aaxauqznfhcvgevfczye.supabase.co
          # Supabase's verified publishable key is safe for browser/E2E use and avoids a stale legacy anon secret.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vjUNgHd3RS2KbXFRYL6k_w_qkAwTT8J
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --project=admin-chromium --reporter=list
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: https://aaxauqznfhcvgevfczye.supabase.co
          # Supabase's verified publishable key is safe for browser/E2E use and avoids a stale legacy anon secret.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vjUNgHd3RS2KbXFRYL6k_w_qkAwTT8J
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: needs.test.result == 'success' && needs.e2e.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Resolve current Supabase privileged API key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: aaxauqznfhcvgevfczye
        run: |
          set -euo pipefail
          npm install -g supabase
          key_json="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          key="$(
            printf '%s' "$key_json" |
              node -e '
                let input = "";
                process.stdin.on("data", chunk => { input += chunk; });
                process.stdin.on("end", () => {
                  const keys = JSON.parse(input);
                  const list = Array.isArray(keys) ? keys : [];
                  const modern = list.find(
                    entry => entry.type === "secret" && typeof entry.api_key === "string" && entry.api_key.startsWith("sb_secret_"),
                  );
                  const legacy = list.find(
                    entry =>
                      (entry.id === "service_role" || (entry.type === "legacy" && entry.name === "service_role")) &&
                      typeof entry.api_key === "string" &&
                      entry.api_key.startsWith("eyJ"),
                  );
                  const value = modern?.api_key ?? legacy?.api_key ?? "";
                  if (!value) process.exit(2);
                  process.stdout.write(value);
                });
              '
          )"
          if [[ ! "$key" =~ ^(sb_secret_|eyJ) ]]; then
            echo "::error::Supabase API-key resolution returned an unexpected key format."
            exit 1
          fi
          echo "::add-mask::$key"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s
' "$key" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  health-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Wait for deployment
        run: sleep 30
      - name: Check health endpoint
        run: |
          curl -f ${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/health || exit 1
