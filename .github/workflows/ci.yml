name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "research/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: aaxauqznfhcvgevfczye
  NEXT_PUBLIC_SUPABASE_URL: https://aaxauqznfhcvgevfczye.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vjUNgHd3RS2KbXFRYL6k_w_qkAwTT8J

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Adapter CLI smoke
        run: npm run test:adapter

  gen-types:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Generate TypeScript types from authoritative schema
        run: npx --no-install supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public > src/lib/supabase/types.auto.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Fail on generated type drift
        run: |
          if ! diff -q src/lib/supabase/types.ts src/lib/supabase/types.auto.ts > /dev/null 2>&1; then
            echo "::error::Checked-in Supabase types are out of sync with the live Aqarat schema."
            echo "Regenerate src/lib/supabase/types.ts from project $SUPABASE_PROJECT_ID and commit the exact result."
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: generated-types
          path: src/lib/supabase/types.auto.ts
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:run

  schema-contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Verify Aqarat OS application contract
        run: npm run contract:check

  e2e:
    runs-on: ubuntu-latest
    needs: [test, schema-contract]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Resolve current Supabase privileged API key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys"             --data-urlencode "reveal=true"             --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          key="$(node -e 'const x=JSON.parse(process.argv[1]); const keys=Array.isArray(x)?x:(Array.isArray(x.keys)?x.keys:Array.isArray(x.api_keys)?x.api_keys:[]); const key=keys.find(k=>k.type==="secret"&&typeof k.api_key==="string"&&k.api_key.startsWith("sb_secret_"))?.api_key; if(!key) process.exit(2); process.stdout.write(key);' "$response")"
          if [[ ! "$key" =~ ^sb_secret_ ]]; then
            echo "::error::Supabase Management API did not return a supported secret key."
            exit 1
          fi
          echo "::add-mask::$key"
          printf '%s\n' "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
          echo "Resolved current Supabase privileged API key for CI."
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --reporter=list
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: needs.test.result == 'success' && needs.e2e.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Resolve current Supabase privileged API key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys"             --data-urlencode "reveal=true"             --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          key="$(node -e 'const x=JSON.parse(process.argv[1]); const keys=Array.isArray(x)?x:(Array.isArray(x.keys)?x.keys:Array.isArray(x.api_keys)?x.api_keys:[]); const key=keys.find(k=>k.type==="secret"&&typeof k.api_key==="string"&&k.api_key.startsWith("sb_secret_"))?.api_key; if(!key) process.exit(2); process.stdout.write(key);' "$response")"
          if [[ ! "$key" =~ ^sb_secret_ ]]; then
            echo "::error::Supabase Management API did not return a supported secret key."
            exit 1
          fi
          echo "::add-mask::$key"
          printf '%s\n' "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  health-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Verify production health
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 15 "https://sadat-mls.vercel.app/api/health" | grep -q '"status":"ok"'; then
              echo "Production health endpoint passed."
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "::error::Production health endpoint did not become healthy."
              exit 1
            fi
            echo "Health check attempt ${attempt}/20 did not pass; retrying."
            sleep 10
          done

          rate_status="$(curl --silent --show-error --max-time 15 \
            --output /tmp/auth-rate-limit.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            "https://sadat-mls.vercel.app/api/auth/rate-limit")"

          if [[ "$rate_status" != "200" ]]; then
            echo "::error::Production auth rate-limit readiness failed with HTTP $rate_status."
            cat /tmp/auth-rate-limit.json
            exit 1
          fi

          if ! grep -q '"allowed":true' /tmp/auth-rate-limit.json; then
            echo "::error::Production auth rate-limit readiness returned an unexpected response."
            cat /tmp/auth-rate-limit.json
            exit 1
          fi

          echo "Production health and auth rate-limit readiness checks passed."
