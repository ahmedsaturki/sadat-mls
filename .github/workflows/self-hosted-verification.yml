name: Self-hosted Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Sanitize runner workspace
        shell: bash
        run: git clean -ffdx

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Adapter CLI smoke
        run: npm run test:adapter

      - name: Typecheck
        run: npm run typecheck

      - name: Schema contract
        run: npm run contract:check

      - name: Unit and integration tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check
