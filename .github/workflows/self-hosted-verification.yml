name: Self-hosted Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Sanitize runner workspace
        shell: bash
        run: git clean -ffdx

      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" = "24"
          command -v node
          command -v npm

      - name: Diagnose local Supabase Docker state (read-only)
        shell: bash
        run: |
          set +e
          echo "=== FILESYSTEM ==="
          df -h / /mnt/c /mnt/d 2>/dev/null
          echo
          echo "=== DOCKER INFO ==="
          docker info --format 'DockerRootDir={{.DockerRootDir}} CPUs={{.NCPU}} Memory={{.MemTotal}}'
          echo
          echo "=== DOCKER DISK ==="
          docker system df
          echo
          echo "=== CONTAINERS ==="
          docker ps -a --format '{{.ID}}\\t{{.Image}}\\t{{.Names}}\\t{{.Status}}' | grep -Ei 'supabase|postgres' || true
          echo
          echo "=== PORT 54322 ==="
          ss -lntp 2>/dev/null | grep ':54322 ' || true
          echo
          echo "=== SUPABASE/POSTGRES CONTAINER STATE + LOGS ==="
          for cid in $(docker ps -aq); do
            image="$(docker inspect -f '{{.Config.Image}}' "$cid" 2>/dev/null)"
            name="$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's#^/##')"
            if echo "$image $name" | grep -Eiq 'supabase|postgres'; then
              docker inspect "$cid" --format 'name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' 2>/dev/null
              echo "--- $name ---"
              docker logs --tail 160 "$cid" 2>&1 || true
            fi
          done

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify authoritative Supabase migration ledger
        run: npm run db:verify-migrations

      - name: Lint
        run: npm run lint

      - name: Adapter CLI smoke
        run: npm run test:adapter

      - name: Typecheck
        run: npm run typecheck

      - name: Schema contract
        run: npm run contract:check

      - name: Unit and integration tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check
